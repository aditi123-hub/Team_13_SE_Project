name: Bank Management System CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stage-1-lint:
    name: 1. Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Oxlint / Syntax Verification
        run: |
          cd frontend
          npm run lint

  stage-2-build:
    name: 2. Build & Compile Assets
    needs: [stage-1-lint]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bank_db"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Prisma Client & Frontend Bundle
        run: |
          cd backend
          npm install
          npx prisma generate --schema=prisma/schema.prisma
          cd ../frontend
          npm install
          npm run build

  stage-3-unit-tests:
    name: 3. Unit & Security Tests (70 Tests)
    needs: [stage-2-build]
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Kolkata"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bank_db"
      JWT_SECRET: "bms-secret-key-development-2026"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute 70 Backend Unit & Security Tests
        run: |
          cd backend
          npm install
          npx prisma generate --schema=prisma/schema.prisma
          npm test

  stage-4-e2e-api:
    name: 4. End-to-End API Verification (21 Requests)
    needs: [stage-3-unit-tests]
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Kolkata"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bank_db"
      JWT_SECRET: "bms-secret-key-development-2026"
      ENABLE_HTTPS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate TLS 1.2+ Certificates (BMS-SR-001)
        run: |
          mkdir -p certs backend/certs
          openssl req -x509 -newkey rsa:2048 -keyout certs/server-key.pem -out certs/server-cert.pem -sha256 -days 365 -nodes -subj "/CN=localhost"
          cp certs/server-key.pem backend/certs/server-key.pem
          cp certs/server-cert.pem backend/certs/server-cert.pem

      - name: Execute 21 Sequential Banking API Requests
        run: |
          cd backend
          npm install
          npx prisma generate --schema=prisma/schema.prisma
          cd ..
          node backend/tests/testAll21.js

  stage-5-scorecard:
    name: 5. Evaluation Scorecard & Traceability
    needs: [stage-4-e2e-api]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

