          ```mermaid
          flowchart LR
              A["1. Code Quality & Lint"] --> B["2. Build & Compile Assets"]
              B --> C["3. Unit & Security Tests (70 Tests)"]
              C --> D["4. E2E API Verification (21 Requests)"]
              D --> E["5. Evaluation Scorecard (100 / 100)"]
              
              style A fill:#238636,stroke:#2ea043,color:#fff
              style B fill:#238636,stroke:#2ea043,color:#fff
              style C fill:#238636,stroke:#2ea043,color:#fff
              style D fill:#238636,stroke:#2ea043,color:#fff
